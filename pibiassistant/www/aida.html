<!doctype html>
<html lang="{{ boot.lang }}" data-theme="{{ 'dark' if boot.theme == 'dark' else 'light' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="csrf-token" content="{{ boot.csrf_token }}">
  <title>AIDA</title>
  <link rel="icon" type="image/svg+xml" href="/assets/pibiassistant/chat/widget/aida-icon.svg">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("aida_theme");
        if (t === "auto") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  {% for name in ["tokens", "fonts", "base", "components", "layout", "chat", "composer", "settings"] %}
  <link rel="stylesheet" href="/assets/pibiassistant/aida/css/{{ name }}.css?v={{ asset_version }}">
  {% endfor %}
</head>
<body>
  <div id="aida-root"></div>
  <noscript>{{ _("AIDA needs JavaScript to run. Please enable JavaScript in your browser.") }}</noscript>
  <script>{% for key in boot %}window["{{ key }}"] = {{ boot[key] | tojson }};{% endfor %}</script>
  <script src="/assets/frappe/node_modules/socket.io-client/dist/socket.io.min.js"></script>
  <script type="module" src="/assets/pibiassistant/aida/js/main.js?v={{ asset_version }}"></script>
</body>
</html>
