<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8eef4"/>
      <stop offset="100%" stop-color="#d0d8e0"/>
    </linearGradient>
    <linearGradient id="hair" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#c0392b"/>
      <stop offset="100%" stop-color="#922b21"/>
    </linearGradient>
    <linearGradient id="skin" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#fde0d0"/>
      <stop offset="100%" stop-color="#f5c6a8"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f0f0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes blink {
      0%, 94%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    @keyframes headBob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-0.3px) rotate(-0.5deg); }
      75% { transform: translateY(0.3px) rotate(0.5deg); }
    }
    @keyframes smileWiden {
      0%, 80%, 100% { d: path("M 28 35.5 Q 32 38 36 35.5"); }
      90% { d: path("M 27 35.5 Q 32 39 37 35.5"); }
    }
    @keyframes glintMove {
      0%, 100% { opacity: 0.8; cx: 27.6; }
      50% { opacity: 1; cx: 28; }
    }
    .eye-group { animation: blink 4s ease-in-out infinite; transform-origin: center; }
    .head-group { animation: headBob 6s ease-in-out infinite; transform-origin: 32px 30px; }
    .eye-glint-l { animation: glintMove 3s ease-in-out infinite; }
    .eye-glint-r { animation: glintMove 3s ease-in-out infinite; }
  </style>

  <!-- Circular background -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>

  <!-- Shirt/collar -->
  <path d="M 18 52 Q 18 46 24 44 L 32 42 L 40 44 Q 46 46 46 52 L 46 58 Q 40 62 32 62 Q 24 62 18 58 Z"
        fill="url(#shirt)"/>
  <path d="M 28 44 L 32 48 L 36 44" stroke="#e0e0e0" stroke-width="0.8" fill="none"/>

  <!-- Neck -->
  <rect x="29" y="40" width="6" height="5" rx="2" fill="url(#skin)"/>

  <g class="head-group">
    <!-- Hair back layer -->
    <path d="M 14 28 Q 12 18 18 12 Q 24 6 32 6 Q 40 6 46 12 Q 52 18 50 28 L 50 36 Q 50 42 46 44 L 44 38 Q 44 34 42 32 L 22 32 Q 20 34 20 38 L 18 44 Q 14 42 14 36 Z"
          fill="url(#hair)"/>

    <!-- Face -->
    <ellipse cx="32" cy="30" rx="12" ry="13" fill="url(#skin)"/>

    <!-- Hair fringe -->
    <path d="M 18 24 Q 18 14 24 10 Q 28 7 32 8 Q 36 7 40 10 Q 46 14 46 24 Q 44 18 38 16 Q 34 15 32 17 Q 30 15 26 16 Q 20 18 18 24 Z"
          fill="url(#hair)"/>

    <!-- Side hair waves -->
    <path d="M 18 26 Q 16 30 17 36 Q 18 40 20 42 Q 18 38 19 34 Q 20 30 20 26 Z" fill="url(#hair)"/>
    <path d="M 46 26 Q 48 30 47 36 Q 46 40 44 42 Q 46 38 45 34 Q 44 30 44 26 Z" fill="url(#hair)"/>

    <!-- Glasses frames -->
    <circle cx="27" cy="29" r="4.5" stroke="#555" stroke-width="1.2" fill="none"/>
    <circle cx="37" cy="29" r="4.5" stroke="#555" stroke-width="1.2" fill="none"/>
    <line x1="31.5" y1="28.5" x2="32.5" y2="28.5" stroke="#555" stroke-width="1"/>
    <line x1="22.5" y1="28" x2="20" y2="26" stroke="#555" stroke-width="0.8"/>
    <line x1="41.5" y1="28" x2="44" y2="26" stroke="#555" stroke-width="0.8"/>

    <!-- Eyes with blink animation -->
    <g class="eye-group" style="transform-origin: 27px 29px">
      <ellipse cx="27" cy="29" rx="2.2" ry="2.4" fill="#5d4037"/>
      <circle class="eye-glint-l" cx="27.6" cy="28.2" r="0.7" fill="white" opacity="0.8"/>
    </g>
    <g class="eye-group" style="transform-origin: 37px 29px">
      <ellipse cx="37" cy="29" rx="2.2" ry="2.4" fill="#5d4037"/>
      <circle class="eye-glint-r" cx="37.6" cy="28.2" r="0.7" fill="white" opacity="0.8"/>
    </g>

    <!-- Eyebrows -->
    <path d="M 24 24.5 Q 27 23 30 24.5" stroke="#8b5e3c" stroke-width="0.8" fill="none"/>
    <path d="M 34 24.5 Q 37 23 40 24.5" stroke="#8b5e3c" stroke-width="0.8" fill="none"/>

    <!-- Nose -->
    <path d="M 32 31 Q 31.5 33 32 34" stroke="#dba890" stroke-width="0.6" fill="none" stroke-linecap="round"/>

    <!-- Smile -->
    <path d="M 28 35.5 Q 32 38.5 36 35.5" stroke="#c0392b" stroke-width="1" stroke-linecap="round" fill="none">
      <animate attributeName="d" values="M 28 35.5 Q 32 38 36 35.5;M 27 35.5 Q 32 39 37 35.5;M 28 35.5 Q 32 38 36 35.5" dur="5s" repeatCount="indefinite"/>
    </path>

    <!-- Earring dots -->
    <circle cx="19.5" cy="32" r="0.8" fill="#9e9e9e"/>
    <circle cx="44.5" cy="32" r="0.8" fill="#9e9e9e"/>
  </g>

  <!-- Subtle border -->
  <circle cx="32" cy="32" r="30" stroke="#4682b4" stroke-width="0.5" fill="none" opacity="0.3"/>
</svg>
