<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8eef4"/>
      <stop offset="100%" stop-color="#d0d8e0"/>
    </linearGradient>
    <linearGradient id="hair" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#c0392b"/>
      <stop offset="100%" stop-color="#922b21"/>
    </linearGradient>
    <linearGradient id="skin" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#fde0d0"/>
      <stop offset="100%" stop-color="#f5c6a8"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
    .eyes { animation: blink 4s ease-in-out infinite; transform-origin: center; }
  </style>

  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#bg)"/>

  <!-- Shirt -->
  <path d="M 10 26 Q 10 24 13 23 L 16 22 L 19 23 Q 22 24 22 26 Q 20 28 16 28 Q 12 28 10 26 Z" fill="white"/>

  <!-- Neck -->
  <rect x="14.5" y="21" width="3" height="2" rx="1" fill="url(#skin)"/>

  <!-- Hair back -->
  <path d="M 9 14 Q 8.5 10 10.5 7 Q 12.5 4.5 16 4.5 Q 19.5 4.5 21.5 7 Q 23.5 10 23 14 L 23 17 Q 23 20 21.5 21 L 21 18.5 Q 21.5 17 21 16 L 11 16 Q 10.5 17 11 18.5 L 10.5 21 Q 9 20 9 17 Z"
        fill="url(#hair)"/>

  <!-- Face -->
  <ellipse cx="16" cy="15" rx="6" ry="6.5" fill="url(#skin)"/>

  <!-- Hair fringe -->
  <path d="M 10 12 Q 10 8 12.5 6 Q 14 4.8 16 5.2 Q 18 4.8 19.5 6 Q 22 8 22 12 Q 21 9.5 19 8.5 Q 17.5 7.8 16 8.8 Q 14.5 7.8 13 8.5 Q 11 9.5 10 12 Z"
        fill="url(#hair)"/>

  <!-- Side hair wisps -->
  <path d="M 9.5 13.5 Q 9 15.5 9.2 17 Q 9.5 18.5 10.5 19.5 Q 9.5 18 9.8 16.5 Q 10 15 10 13.5 Z" fill="url(#hair)"/>
  <path d="M 22.5 13.5 Q 23 15.5 22.8 17 Q 22.5 18.5 21.5 19.5 Q 22.5 18 22.2 16.5 Q 22 15 22 13.5 Z" fill="url(#hair)"/>

  <!-- Glasses -->
  <circle cx="13.5" cy="14.5" r="2.3" stroke="#555" stroke-width="0.7" fill="none"/>
  <circle cx="18.5" cy="14.5" r="2.3" stroke="#555" stroke-width="0.7" fill="none"/>
  <line x1="15.8" y1="14.2" x2="16.2" y2="14.2" stroke="#555" stroke-width="0.6"/>

  <!-- Eyes with blink -->
  <g class="eyes" style="transform-origin: 13.5px 14.5px">
    <circle cx="13.5" cy="14.5" r="1.1" fill="#5d4037"/>
    <circle cx="13.8" cy="14" r="0.35" fill="white" opacity="0.8"/>
  </g>
  <g class="eyes" style="transform-origin: 18.5px 14.5px">
    <circle cx="18.5" cy="14.5" r="1.1" fill="#5d4037"/>
    <circle cx="18.8" cy="14" r="0.35" fill="white" opacity="0.8"/>
  </g>

  <!-- Smile with subtle animation -->
  <path d="M 14 17.5 Q 16 19 18 17.5" stroke="#c0392b" stroke-width="0.6" stroke-linecap="round" fill="none">
    <animate attributeName="d" values="M 14 17.5 Q 16 19 18 17.5;M 13.5 17.5 Q 16 19.5 18.5 17.5;M 14 17.5 Q 16 19 18 17.5" dur="5s" repeatCount="indefinite"/>
  </path>
</svg>
